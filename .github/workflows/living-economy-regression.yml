name: Living Britain regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - "living_economy.py"
      - "household.py"
      - "sim.py"
      - "state.py"
      - "engine.py"
      - "requirements.txt"
      - ".github/workflows/living-economy-regression.yml"
  push:
    branches: [main]
    paths:
      - "living_economy.py"
      - "household.py"
      - "sim.py"
      - "state.py"
      - "engine.py"
      - "requirements.txt"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile changed Python modules
        run: |
          python -m py_compile living_economy.py household.py sim.py state.py engine.py
      - name: Run simulator regression suite
        run: python sim.py check
