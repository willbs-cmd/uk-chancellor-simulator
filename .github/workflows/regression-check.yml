name: Chancellor Simulator regression checks

on:
  push:
    paths:
      - "**.py"
      - "data/**"
      - ".github/workflows/regression-check.yml"
  pull_request:
    paths:
      - "**.py"
      - "data/**"
      - ".github/workflows/regression-check.yml"
  workflow_dispatch:

jobs:
  content-and-balance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless test dependency
        run: python -m pip install --upgrade pip pandas
      - name: Compile application modules
        run: python -m py_compile app.py mp_career_app.py career.py state.py engine.py budget.py parliament.py sim.py
      - name: Validate content and strategy balance
        run: python sim.py check
